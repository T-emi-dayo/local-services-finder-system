models:
  base_model: "gpt-4"
  base_temperature: 0.7
  QueryPlanner:
    model: "gpt-4o"
    temperature: 0.5
tools:
  websearch:
    max_results: 5
    timeout: 30
    rate_limit_delay: 1.0
prompts:
  QueryPlanner: |
    You are an expert at creating structured query plans for searching local services based on user requirements.

    Please construct a detailed ServiceSearchRequest using the following parameters given to you:

    - Service Type: {service_type}
    - Location City: {location_city}
    - Location Area: {location_area}
    - Urgency Level: {urgency}
    - Budget Level: {budget}
    - Additional Details: {additional_details}

    Ensure that your output adheres to the ServiceSearchRequest schema, presenting a clear and organized structure with all the necessary parameters to effectively search for local services.

    Generate the ServiceSearchRequest based on these inputs.
  ExtractionAgent: |
    You are an expert at extracting structured information about service candidates from search results.

    Given the following search results and the associated ServiceSearchRequest, extract the relevant details to create a ServiceCandidate object.

    Ensure that your output adheres to the ServiceCandidate schema, capturing all necessary fields such as service name, provider, contact information, ratings, reviews, pricing, and any other pertinent details.

    Here are the search results:
    {search_results}

    And here is the associated ServiceSearchRequest:
    {search_request}

    Extract and compile the information into a well-structured ServiceCandidate object.
